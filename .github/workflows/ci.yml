name: CI

on:
  push:
    branches: [main, release/**]
    tags: ['v*']
  pull_request:
    branches: [main, release/**]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: Patina/Patina.csproj

jobs:
  test:
    name: Unit tests (Patina.Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test
        run: dotnet test Patina.Tests/Patina.Tests.csproj -c Release --logger GitHubActions

  desktop:
    name: Desktop (${{ matrix.rid }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} -f net10.0-desktop -c Release -r ${{ matrix.rid }} --self-contained -p:PatinaTargetFrameworks=net10.0-desktop -o publish/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: patina-desktop-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

  wasm:
    name: WebAssembly (PWA)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools
      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} -f net10.0-browserwasm -c Release -p:PatinaTargetFrameworks=net10.0-browserwasm -o publish/wasm
      - uses: actions/upload-artifact@v4
        with:
          name: patina-wasm
          path: publish/wasm/wwwroot

  pages:
    name: Deploy WebAssembly to GitHub Pages
    # Opt in per repository: set the repository variable DEPLOY_PAGES to 'true' and enable Pages (source: GitHub Actions).
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools
      - name: Publish for a project site
        # Pages serves https://<owner>.github.io/<repo>/ and the bootstrapper writes absolute asset paths,
        # so the base path is set at publish time.
        run: dotnet publish ${{ env.PROJECT }} -f net10.0-browserwasm -c Release -p:WasmShellWebAppBasePath=/${{ github.event.repository.name }}/ -o publish/wasm
      - name: Prepare the site
        run: |
          mkdir -p site && cp -r publish/wasm/wwwroot/. site/
          # Navigation pushes deep links (/Main/Collection); serve the app for unknown paths.
          cp site/index.html site/404.html
          # Jekyll would drop _framework/.
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - name: Install android workload
        run: dotnet workload install android
      - name: Restore signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/patina.keystore"
      - name: Publish (signed when the keystore secrets exist, debug-signed otherwise)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          SIGN=""
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            SIGN="-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/patina.keystore -p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD -p:AndroidSigningStorePass=env:ANDROID_STORE_PASSWORD"
          fi
          # One format per publish: a list value did not produce both packages locally.
          dotnet publish ${{ env.PROJECT }} -f net10.0-android -c Release -p:PatinaTargetFrameworks=net10.0-android -p:AndroidPackageFormat=aab $SIGN -o publish/android
          dotnet publish ${{ env.PROJECT }} -f net10.0-android -c Release -p:PatinaTargetFrameworks=net10.0-android -p:AndroidPackageFormat=apk $SIGN -o publish/android
      - uses: actions/upload-artifact@v4
        with:
          name: patina-android
          path: |
            publish/android/*.aab
            publish/android/*.apk

  ios:
    name: iOS (simulator build check)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.3xx'
      - name: Install ios workload (pinned)
        # Each .NET for iOS release requires one exact Xcode version. Pin the SDK band's workload set, then select the
        # matching Xcode from the side-by-side installs on the hosted image (2026-10-03: workload 26.2 wants 26.3,
        # the image default is 26.6).
        run: dotnet workload install ios --version 10.0.300
      - name: Select the Xcode the iOS workload requires
        run: |
          ls -d /Applications/Xcode*.app
          want=$(ls ~/.dotnet/packs | grep -o 'Microsoft.iOS.Sdk.net10.0_[0-9.]*' | head -1 | sed 's/.*_//')
          echo "iOS workload $want"
          xcode=$(ls -d /Applications/Xcode_${want}*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            req=$(dotnet build ${{ env.PROJECT }} -f net10.0-ios -c Release -r iossimulator-arm64 -p:PatinaTargetFrameworks=net10.0-ios 2>&1 | grep -o 'requires Xcode [0-9.]*' | head -1 | awk '{print $3}')
            xcode=$(ls -d /Applications/Xcode_${req}*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; echo "SKIP_XCODE_CHECK=false" >> "$GITHUB_ENV"; else echo "SKIP_XCODE_CHECK=true" >> "$GITHUB_ENV"; fi
          xcodebuild -version
      - name: Build for the simulator (no signing)
        # Store builds need an Apple Developer account, a distribution certificate and a provisioning profile;
        # see docs/DEPLOY.md. This job proves the iOS head compiles. The Xcode version check is relaxed only when the
        # exact Xcode the workload wants is not on the image.
        run: |
          EXTRA=""
          if [ "$SKIP_XCODE_CHECK" = "true" ]; then EXTRA="-p:ValidateXcodeVersion=false"; fi
          dotnet build ${{ env.PROJECT }} -f net10.0-ios -c Release -r iossimulator-arm64 -p:PatinaTargetFrameworks=net10.0-ios $EXTRA
